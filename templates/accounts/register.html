{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content_class %}auth-layout{% endblock %}

{% block content %}
<section class="form-card auth-card">
    <h2>Create Account</h2>
    <p class="muted">Sign up to start managing appointments and consultations.</p>

    <form method="POST" class="stack-form django-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Register</button>
    </form>
</section>
{% endblock %}
